name: sas-testifier-lab
services:
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    pull_policy: never
    environment:
      POSTGRES_DB: synthetic_lab
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: synthetic_lab_only
      TZ: UTC
    ports: ["127.0.0.1:55441:5432"]
    networks: [lab]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_owner -d synthetic_lab"]
      interval: 2s
      timeout: 2s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    pull_policy: never
    volumes: ["./clickhouse.xml:/etc/clickhouse-server/config.d/testifier.xml:ro"]
    networks: [lab]
    mem_limit: 1500m
    cpus: 1
    pids_limit: 512
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30
  superset:
    image: llm-metadata-abc-superset@sha256:ddbc69d45867c11698d52d6ec4289320d0d84af81ebce8e49c5c833110a85551
    pull_policy: never
    environment:
      SUPERSET_CONFIG_PATH: /lab/superset_config.py
      SUPERSET_HOME: /tmp/superset_home
      FLASK_APP: superset
    volumes: ["./superset_config.py:/lab/superset_config.py:ro", "./start_bi.py:/lab/start_bi.py:ro"]
    entrypoint: ["/app/.venv/bin/python", "/lab/start_bi.py"]
    ports: ["127.0.0.1:18088:8088"]
    networks: [lab]
    mem_limit: 1800m
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 40
networks:
  lab: {driver: bridge}
